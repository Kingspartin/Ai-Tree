[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wfbot"
version = "0.1.0"
description = "Automated warframe.market trading assistant: opportunity scanner and listing manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
clipboard = ["pyperclip>=1.8"]
dev = ["pytest>=7.4"]

[project.scripts]
wfbot = "wfbot.cli:main"

[tool.setuptools.packages.find]
include = ["wfbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
